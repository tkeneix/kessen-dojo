[project]
name = "kessen-dojo"
version = "0.1.0"
description = "決戦道場: 複数ペルソナのAIエージェントが評価指標で競い合うコンペ実行基盤"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "paddy" }]
keywords = ["agent", "claude", "competition", "multi-persona", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "claude-agent-sdk>=0.1.71",
    "click>=8.1",
    "pydantic>=2.9",
    "openai>=1.55",                   # OpenAIペルソナ + GrokPersona (xAI互換) で使用
    "fastapi>=0.115",                 # P4: REST API
    "uvicorn[standard]>=0.32",
    "google-genai>=1.74.0",
    "pandas>=3.0.2",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
    "scikit-learn>=1.8.0",
    "polars>=1.40.1",
    "matplotlib>=3.10.9",
]

[project.optional-dependencies]
all = []   # 現状追加optional無し (将来 docker SDK 等で使う想定)

[project.scripts]
kessen = "kessen.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kessen"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]   # line-length は ruff が format で吸収

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
